<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Time</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>My Time</h1>
        <form method="POST" action="{{ url_for('my_time') }}">
            <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" name="date" value="{{ mytime_model.date }}" required>
            </div>
            <div class="mb-3">
                <label for="project_id" class="form-label">Project ID</label>
                <select class="form-control" id="project_id" name="project_id" required>
                    {% for pid in mytime_model.project_ids %}
                        <option value="{{ pid }}">{{ pid }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="work_type" class="form-label">Work Type</label>
                <select class="form-control" id="work_type" name="work_type" required>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Capacity">Capacity</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="hours_worked" class="form-label">Hours Worked</label>
                <input type="number" class="form-control" id="hours_worked" name="hours_worked" required>
            </div>
            <button type="submit" class="btn btn-primary submit-button">Submit</button>
        </form>
        <h2 class="mt-5">Records</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Hours</th>
                    <th>Project ID</th>
                    <th>Work Type</th>
                </tr>
            </thead>
            <tbody>
                {% for record in mytime_model.records %}
                    <tr>
                        <td>{{ record.date }}</td>
                        <td>{{ record.hours }}</td>
                        <td>{{ record.project_id }}</td>
                        <td>{{ record.work_type }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
